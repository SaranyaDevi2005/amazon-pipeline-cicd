# ============================================================================
# GitHub Actions CI/CD Workflow for Amazon Data Pipeline
# Continuous Integration / Continuous Deployment
# ============================================================================
#
# This workflow automates:
#   1. Lint / validate the DAB configuration on every push/PR
#   2. Run unit tests on Databricks (transformation logic, validation rules)
#   3. Deploy the pipeline bundle to dev environment (on PR merge)
#   4. Deploy to production (on tag/release)
#
# Prerequisites:
#   - DATABRICKS_HOST and DATABRICKS_TOKEN stored as GitHub Actions secrets
#   - Databricks CLI installed (comes pre-installed on ubuntu-latest with actions)
# ============================================================================

name: Amazon Pipeline CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  release:
    types: [published]

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Validate bundle configuration (runs on every push and PR)
  # --------------------------------------------------------------------------
  validate-bundle:
    name: Validate DAB Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      
      - name: Configure Databricks CLI
        run: |
          databricks auth env
      
      - name: Validate bundle (dev)
        run: |
          databricks bundle validate -t dev
      
      - name: Validate bundle (prod)
        if: github.ref == 'refs/heads/main'
        run: |
          databricks bundle validate -t prod

  # --------------------------------------------------------------------------
  # Stage 2: Run unit tests on Databricks (runs on every push and PR)
  # --------------------------------------------------------------------------
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: validate-bundle
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      
      - name: Configure Databricks CLI
        run: |
          databricks auth env
      
      - name: Deploy test bundle to dev
        run: |
          databricks bundle deploy -t dev
      
      - name: Run unit tests via Databricks job
        run: |
          # Trigger the test job and wait for completion
          JOB_ID=$(databricks bundle deploy -t dev --output json | jq -r '.jobs["amazon_pipeline_tests"].job_id')
          RUN_ID=$(databricks jobs run-now --job-id $JOB_ID --output json | jq -r '.run_id')
          echo "Test job run ID: $RUN_ID"
          
          # Poll until the run completes
          STATUS=""
          while [ "$STATUS" != "TERMINATED" ]; do
            sleep 30
            STATUS=$(databricks jobs get-run --run-id $RUN_ID --output json | jq -r '.state.life_cycle_state')
            echo "Current status: $STATUS"
          done
          
          RESULT=$(databricks jobs get-run --run-id $RUN_ID --output json | jq -r '.state.result_state')
          echo "Final result: $RESULT"
          
          if [ "$RESULT" != "SUCCESS" ]; then
            echo "❌ Unit tests failed!"
            databricks jobs get-run-output --run-id $RUN_ID
            exit 1
          fi
          
          echo "✅ All unit tests passed!"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  # --------------------------------------------------------------------------
  # Stage 3: Deploy to dev (on merge to develop)
  # --------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: run-unit-tests
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      
      - name: Configure Databricks CLI
        run: |
          databricks auth env
      
      - name: Deploy bundle to dev
        run: |
          databricks bundle deploy -t dev
      
      - name: Notify deployment
        run: |
          echo "✅ Deployed Amazon Pipeline to DEV environment"

  # --------------------------------------------------------------------------
  # Stage 4: Deploy to production (on release)
  # --------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: run-unit-tests
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      
      - name: Configure Databricks CLI
        run: |
          databricks auth env
      
      - name: Deploy bundle to prod
        run: |
          databricks bundle deploy -t prod
      
      - name: Notify deployment
        run: |
          echo "✅ Deployed Amazon Pipeline to PRODUCTION environment"